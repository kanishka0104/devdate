<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDate - Find Developers</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay" style="display: flex;">
        <div class="spinner"></div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="container" style="display: block;">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-logo">
                <i class="fas fa-fire"></i> DevDate
            </div>
            <div class="nav-menu">
                <a href="#" onclick="showPage('discover')" class="nav-item active" data-page="discover">
                    <i class="fas fa-fire"></i>
                    <span>Discover</span>
                </a>
                <a href="#" onclick="showPage('matches')" class="nav-item" data-page="matches">
                    <i class="fas fa-heart"></i>
                    <span>Matches</span>
                </a>
                <a href="#" onclick="showPage('chat')" class="nav-item" data-page="chat">
                    <i class="fas fa-comments"></i>
                    <span>Chat</span>
                </a>
                <a href="#" onclick="showPage('profile')" class="nav-item" data-page="profile">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="#" onclick="logout()" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </nav>

        <!-- Pages -->
        <main class="main-content">
            <!-- Discover Page -->
            <div id="discover-page" class="page active">
                <div class="page-header">
                    <h1>Discover Developers</h1>
                    <p>Swipe right to connect, left to pass</p>
                </div>
                <div id="swipe-deck" class="swipe-deck">
                </div>
                <div id="no-more-cards" class="no-more-cards" style="display: none;">
                    <h2>No More Developers</h2>
                    <p>Check back later for more profiles!</p>
                    <button onclick="loadRecommendations()" class="btn btn-primary">Refresh</button>
                </div>
            </div>

            <!-- Matches Page -->
            <div id="matches-page" class="page">
                <div class="page-header">
                    <h1>Your Matches</h1>
                </div>
                <div id="matches-grid" class="matches-grid"></div>
            </div>

            <!-- Chat Page -->
            <div id="chat-page" class="page">
                <div class="chat-container">
                    <div id="chat-list" class="chat-list"></div>
                    <div id="chat-window" class="chat-window" style="display: none;">
                        <div class="chat-header">
                            <button onclick="backToChats()" class="back-btn">
                                <i class="fas fa-arrow-left"></i>
                            </button>
                            <div id="chat-user-info" class="chat-user-info"></div>
                        </div>
                        <div id="messages-container" class="messages-container"></div>
                        <div class="message-input-container">
                            <input type="text" id="message-input" placeholder="Type a message...">
                            <button onclick="sendMessage()" class="send-btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Page -->
            <div id="profile-page" class="page">
                <div class="page-header">
                    <h1>My Profile</h1>
                    <button onclick="showEditProfile()" class="btn btn-primary">Edit Profile</button>
                </div>
                <div id="profile-view" class="profile-view"></div>
            </div>
        </main>
    </div>

    <!-- Match Modal -->
    <div id="match-modal" class="modal" style="display: none;">
        <div class="modal-content match-modal">
            <div class="match-animation">
                <div class="match-icon" id="match-icon">🎉</div>
                <h1 id="match-title">It's a Match!</h1>
                <p id="match-text">You and User liked each other</p>
            </div>
            <div id="match-profile" class="match-profile"></div>
            <div class="match-actions" id="match-actions">
                <button onclick="closeMatchModal()" class="btn btn-secondary">Keep Swiping</button>
                <button onclick="goToChat()" class="btn btn-primary">Send Message</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button onclick="closeEditModal()" class="close-btn">&times;</button>
            </div>
            <div id="edit-form" class="modal-body"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/swipe.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
