<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDate - Connect with Developers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Animation Libraries -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.29/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            height: 100vh;
        }
        
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            color: white;
            padding: 20px;
        }
        
        .hero-content {
            max-width: 800px;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #f0f0f0, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        
        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }
        
        .hero .tagline {
            font-size: 1.3rem;
            margin-bottom: 20px;
            opacity: 0.95;
            animation: fadeInUp 1s ease;
        }
        
        .hero .hover-sections {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hover-item {
            padding: 50px 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            font-size: 1.3rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
        }
        
        .hover-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(10px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .cta-btn {
            display: inline-block;
            padding: 18px 50px;
            background: white;
            color: #667eea;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            margin-top: 30px;
        }
        
        .cta-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .cta-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .cta-btn:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            color: #4f46e5;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>👨‍💻 DevDate</h1>
            <p class="tagline">Connect. Collaborate. Create.</p>
            
            <div class="hover-sections">
                <div class="hover-item">Connect . Collaborate . Create</div>
                <div class="hover-item">Build New Networks</div>
                <div class="hover-item">Build Projects and Learn More</div>
            </div>
            
            <a href="auth.html" class="cta-btn">Get Started</a>
        </div>
    </div>
    
    <script>
    // Initialize animations for home page
    document.addEventListener('DOMContentLoaded', () => {
        // Smooth scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
        });
        
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
        
        // Animate hover sections
        anime({
            targets: '.hover-item',
            translateX: [-50, 0],
            opacity: [0, 1],
            delay: anime.stagger(150, {start: 300}),
            duration: 800,
            easing: 'easeOutCubic'
        });
        
        // Animate CTA button
        const ctaBtn = document.querySelector('.cta-btn');
        ctaBtn.addEventListener('mouseenter', () => {
            anime({
                targets: ctaBtn,
                scale: [1, 1.05],
                duration: 300,
                easing: 'easeOutCubic'
            });
        });
        
        ctaBtn.addEventListener('mouseleave', () => {
            anime({
                targets: ctaBtn,
                scale: [1.05, 1],
                duration: 300,
                easing: 'easeOutCubic'
            });
        });
    });
    </script>
</body>
</html>
